name: Bug report
description: A checkout field, the order check, the Admin page, the storefront kit or the installation doesn't work as described.
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through a private report instead, see SECURITY.md.
        Never paste `.env` or `.aio` values, workspace credentials, tokens or customer data here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the field definition (JSON from the Admin or CHECKOUT_FIELDS), the store view and customer group, and the values entered.
      placeholder: |
        1. Create a field with ...
        2. At checkout, as a guest on store view ..., enter ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Field validation or visibility
        - Place-order check (webhook)
        - Values on the order (grid column, order view)
        - Admin page
        - Storefront kit or fields feed
        - Installation or App Management
        - Other
    validations:
      required: true
  - type: dropdown
    id: commerce
    attributes:
      label: Commerce
      options:
        - Adobe Commerce as a Cloud Service (SaaS)
        - Adobe Commerce on cloud infrastructure (PaaS)
        - Adobe Commerce on-premises
        - Not relevant
  - type: input
    id: version
    attributes:
      label: Checkout Fields version or commit
      placeholder: v0.1.0 or 47ede00
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output of `aio app logs`, browser console errors or a screenshot. Remove any secrets and customer data first.
      render: text
